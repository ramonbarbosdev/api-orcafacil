spring.application.name=api-orcafacil
server.servlet.context-path=/orcafacil

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=false

springdoc.swagger-ui.use-root-path=true
server.forward-headers-strategy=framework
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET:change-me-use-at-least-32-characters-long}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

app.saas.central.enabled=true
app.saas.routing.enabled=true
app.saas.central.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/orcafacil_central
app.saas.central.username=${DB_USERNAME:postgres}
app.saas.central.password=${DB_PASSWORD:postgres}
app.saas.central.maximum-pool-size=5
app.saas.central.create-database.enabled=true
app.saas.central.create-database.admin-database=postgres
app.saas.central.flyway.enabled=true
app.saas.central.flyway.locations=classpath:db/central

app.saas.tenant-db.host=${DB_HOST:localhost}
app.saas.tenant-db.port=${DB_PORT:5432}
app.saas.tenant-db.username=${DB_USERNAME:postgres}
app.saas.tenant-db.password=${DB_PASSWORD:postgres}
app.saas.tenant-db.maximum-pool-size=5

app.saas.provisioning.enabled=true
app.saas.provisioning.auto-enabled=true
app.saas.provisioning.admin-database=postgres
app.saas.provisioning.migrations-location=classpath:db/migration

app.s3.bucket=${S3_BUCKET:anexoagro}
app.s3.endpoint=${S3_ENDPOINT:https://sfo3.digitaloceanspaces.com}
app.s3.region=${S3_REGION:us-east-1}
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
