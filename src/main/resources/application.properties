spring.application.name=api-orcafacil
server.servlet.context-path=/orcafacil
spring.mvc.trailing-slash-match=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=false

springdoc.swagger-ui.use-root-path=true
server.forward-headers-strategy=framework
springdoc.swagger-ui.path=/swagger-ui.html

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=${JWT_SECRET:change-me-use-at-least-32-characters-long}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

app.saas.central.enabled=true
app.saas.routing.enabled=true
app.saas.central.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/orcafacil_central?sslmode=require&channelBinding=require
app.saas.central.username=${DB_USERNAME}
app.saas.central.password=${DB_PASSWORD}
app.saas.central.maximum-pool-size=5
app.saas.central.create-database.enabled=true
app.saas.central.create-database.admin-database=postgres
app.saas.central.flyway.enabled=true
app.saas.central.flyway.locations=classpath:db/central

app.saas.tenant-db.host=${DB_HOST}
app.saas.tenant-db.port=${DB_PORT}
app.saas.tenant-db.username=${DB_USERNAME}
app.saas.tenant-db.password=${DB_PASSWORD}
app.saas.tenant-db.maximum-pool-size=5

app.saas.provisioning.enabled=true
app.saas.provisioning.auto-enabled=true
app.saas.provisioning.admin-database=postgres
app.saas.provisioning.migrations-location=classpath:db/migration

app.api.expose-error-details=${API_EXPOSE_ERROR_DETAILS:true}

app.s3.bucket=${S3_BUCKET}
app.s3.endpoint=${S3_ENDPOINT}
app.s3.region=${S3_REGION}
app.s3.access-key=${S3_ACCESS_KEY}
app.s3.secret-key=${S3_SECRET_KEY}

app.upload.base-dir=${UPLOAD_BASE_DIR:uploads}
app.upload.logo.max-bytes=2097152

# Integracao notificacao-api (WhatsApp, e-mail, etc.)
app.notificacao.enabled=${NOTIFICACAO_ENABLED:false}
app.notificacao.base-url=${NOTIFICACAO_BASE_URL:http://localhost:8080/api}
app.notificacao.login=${NOTIFICACAO_LOGIN:}
app.notificacao.senha=${NOTIFICACAO_SENHA:}
app.notificacao.api-key=${NOTIFICACAO_API_KEY:}
app.notificacao.id-organizacao=${NOTIFICACAO_ID_ORGANIZACAO:}
app.notificacao.public-base-url=${NOTIFICACAO_PUBLIC_BASE_URL:http://localhost:8080/orcafacil}
app.notificacao.template-orcamento-enviado=${NOTIFICACAO_TEMPLATE_ORCAMENTO:}
app.notificacao.registrar-consentimento-whatsapp=${NOTIFICACAO_REGISTRAR_CONSENTIMENTO:true}
app.notificacao.connect-timeout-ms=${NOTIFICACAO_CONNECT_TIMEOUT_MS:5000}
app.notificacao.read-timeout-ms=${NOTIFICACAO_READ_TIMEOUT_MS:30000}
